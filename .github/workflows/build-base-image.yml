name: Build Base Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: kotbusta-docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-base

jobs:
  build-and-push:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - docker-builder
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify runner cache infrastructure
        run: /usr/local/libexec/heapy-runner-cache/cache-health.sh --quick

      - name: Use persistent Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: heapy-ci
          driver: docker-container
          cleanup: false
          cache-binary: false

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value={{date 'YYYYMMDD'}}-${{ inputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
